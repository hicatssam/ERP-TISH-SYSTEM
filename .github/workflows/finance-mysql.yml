name: Tish Finance MySQL Integration

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tish-finance-mysql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finance-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_secret
          MYSQL_DATABASE: tish_erp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_ci_secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: tish_erp_test
      DB_USERNAME: root
      DB_PASSWORD: root_ci_secret
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.4 + MySQL extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql, mysqli, intl, gd, zip
          coverage: none

      - name: Install dependencies and initialize test app
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate

      - name: Check MySQL is selected
        run: |
          php artisan config:clear
          php artisan tinker --execute="if (config('database.default') !== 'mysql') { throw new RuntimeException('Finance integration tests must run on MySQL'); }"

      - name: Test finance, procurement and confirmed-order accounting on MySQL
        run: |
          php artisan test \
            tests/Feature/Finance \
            tests/Feature/OrderUpdateInventoryGuardTest.php \
            tests/Feature/Payroll \
            tests/Feature/Restaurant/RestaurantPosNonCashDetailsValidationTest.php
