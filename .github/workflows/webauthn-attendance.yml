name: WebAuthn attendance

on:
  pull_request:
    paths:
      - '**/*[Ww]ebauthn*'
      - 'composer.*'
      - 'routes/attendance.php'
      - 'app/Services/AttendanceFeatureService.php'
      - 'app/Http/Controllers/Employee/MyHrController.php'
      - 'app/Http/Controllers/Admin/AttendancePayrollSettingsController.php'
      - 'resources/views/employee/my-hr/**'
      - 'resources/views/admin/settings/attendance-payroll.blade.php'
      - '.github/workflows/webauthn-attendance.yml'

jobs:
  attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, pdo_sqlite, sqlite3, intl, gd, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare application
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate
      - name: Test signed ceremonies, attendance and existing face flow
        run: php artisan test tests/Unit/AttendanceWebauthnVerifierTest.php tests/Feature/Attendance/EmployeeWebauthnAttendanceTest.php tests/Feature/Attendance/FaceAttendanceFlowTest.php
      - name: Test mobile browser flow
        run: node --test tests/Frontend/employee-webauthn.test.cjs
      - name: Verify production caches
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize:clear
